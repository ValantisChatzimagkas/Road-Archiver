[project]
name = "road-archiver"
version = "0.1.0"
description = "REST API for versioned road networks with point-in-time queries"
readme = "README.md"
authors = [{ name = "Valantis Chatzimagkas", email = "valantis.hatzimagkas@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fastapi", "postgis", "geoalchemy", "gis", "versioning"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12,<0.116.0",
    "sqlalchemy>=2.0.40,<2.1.0",  # geoalchemy2 0.17 is not compatible with 2.1
    "pyjwt>=2.10.1,<3.0.0",
    "bcrypt>=4.3.0,<5.0.0",
    "alembic>=1.15.2,<2.0.0",
    "shapely>=2.1.0,<3.0.0",
    "geoalchemy2>=0.17.1,<0.18.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "uvicorn>=0.27.1,<1.0.0",
    "pydantic-settings==2.2.1",
    "email-validator>=2.1,<3.0",
    "python-multipart>=0.0.9,<0.1.0",
    "jinja2>=3.1,<4.0",
]

[project.urls]
Repository = "https://github.com/ValantisChatzimagkas/Road-Archiver"
Documentation = "https://valantischatzimagkas.github.io/Road-Archiver/"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-docker>=3.2.1,<4.0.0",
    "requests>=2.32,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "N"]
